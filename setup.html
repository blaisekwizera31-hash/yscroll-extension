<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doomshield Setup</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo">
          <img src="icons/doomshield-128.png" alt="Doomshield">
        </div>
        <div class="brand">
          <h1>Doomshield</h1>
          <p>Break the cycle. Let's set up your shield.</p>
        </div>
      </div>
    </div>

    <div class="settings">
      <div class="setting-box">
        <p class="label">Daily Limit</p>
        <div class="value">
          <span id="dailyValue">30</span>
          <span class="unit">minutes</span>
        </div>
        <div class="buttons">
          <button id="dailyDecrement" aria-label="Decrease daily limit">−</button>
          <div class="divider"></div>
          <button id="dailyIncrement" aria-label="Increase daily limit">+</button>
        </div>
      </div>

      <div class="setting-box">
        <p class="label">Session Limit</p>
        <div class="value">
          <span id="sessionValue">5</span>
          <span class="unit">minutes</span>
        </div>
        <div class="buttons">
          <button id="sessionDecrement" aria-label="Decrease session limit">−</button>
          <div class="divider"></div>
          <button id="sessionIncrement" aria-label="Increase session limit">+</button>
        </div>
      </div>

      <div class="setting-box">
        <p class="label">Cool Down</p>
        <div class="value">
          <span id="coolValue">5</span>
          <span class="unit">minutes</span>
        </div>
        <div class="buttons">
          <button id="coolDecrement" aria-label="Decrease cooldown">−</button>
          <div class="divider"></div>
          <button id="coolIncrement" aria-label="Increase cooldown">+</button>
        </div>
      </div>
    </div>

    <p class="info">
      Set your limits to maintain focus and prevent burnout.
      You can always change these later in Settings.
    </p>

    <button class="finish-btn" id="finishBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      Activate Shield
    </button>
  </div>

  <script src="setup.js"></script>
</body>
</html>
