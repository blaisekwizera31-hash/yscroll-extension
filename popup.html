<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doomshield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Navigation -->
    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <a href="#" class="nav-logo" aria-label="Doomshield Home">
        <img src="icons/doomshield-48.png" alt="" width="28" height="28" />
      </a>
      <div class="nav-items">
        <button class="nav-item active" data-view="home" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button class="nav-item" data-view="alerts" aria-label="Alerts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span>Alerts</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button class="nav-item" data-view="board" aria-label="Board">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          <span>Board</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button class="nav-item" data-view="settings" aria-label="Settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Settings</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </button>
      </div>
      <button class="nav-profile" id="accountBtn" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </nav>
    <div class="nav-divider"></div>

    <!-- Views -->
    <main class="main" id="mainContent">
      <div id="view-home" class="view active"></div>
      <div id="view-alerts" class="view"></div>
      <div id="view-board" class="view"></div>
      <div id="view-settings" class="view"></div>
      <div id="view-account" class="view"></div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
